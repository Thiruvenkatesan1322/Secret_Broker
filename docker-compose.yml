# Hardened compose: loopback-only ports, Docker secrets, read-only root filesystem,
# no new privileges, all Linux capabilities dropped. The project source is NOT mounted
# into the container; only a read-only task workspace and a writable audit volume are.
services:
  broker:
    build: .
    image: secret-broker:latest
    read_only: true
    user: "broker"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # 127.0.0.1 ONLY - never expose the broker beyond localhost.
      - "127.0.0.1:8787:8787"   # agent API
      - "127.0.0.1:8788:8788"   # admin / approval API
    environment:
      BROKER_TOKEN_FILE: /run/secrets/broker_token
      BROKER_ADMIN_TOKEN_FILE: /run/secrets/admin_token
      BROKER_POLICY: /app/policy.yaml
      BROKER_TASKS: /app/tasks.yaml
      BROKER_AUDIT_LOG: /audit/audit.jsonl
      BROKER_SECRETS_DIR: /run/secrets
      BROKER_WORKSPACE: /workspace
      BROKER_AGENT_HOST: 0.0.0.0   # bound inside the container; host mapping is loopback-only
      BROKER_ADMIN_HOST: 0.0.0.0
    secrets:
      - broker_token
      - admin_token
      - OPENAI_API_KEY
    tmpfs:
      - /tmp
    volumes:
      - audit:/audit                 # writable, isolated from the project
      - ./workspace:/workspace:ro    # read-only task workspace
    restart: unless-stopped

volumes:
  audit:

# Docker secrets are mounted at /run/secrets/<name> inside the container and are not
# visible to the agent's user on the host. Replace the files in ./secrets with real
# values at launch, or source them from your secret manager.
secrets:
  broker_token:
    file: ./secrets/broker_token
  admin_token:
    file: ./secrets/admin_token
  OPENAI_API_KEY:
    file: ./secrets/openai_api_key
