title = "secret-broker gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Ignore documented placeholders and test fixtures (no real secrets)."
paths = [
    '''\.env\.example$''',
    '''AGENT_INSTRUCTIONS\.md$''',
    '''README\.md$''',
    '''tests/.*''',
]
regexes = [
    '''sk-DUMMY-do-not-commit''',
    '''ghp_DUMMYdummydummydummydummy''',
    '''REALSECRET-supersecret-value-0001''',
]
