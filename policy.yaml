# Example policy. Default deny: only the services and (method, path regex) pairs listed
# here are forwarded. The broker injects the real credential server-side; the agent never
# sends an Authorization header. Path regexes are matched (fullmatch) against the request
# sub-path WITHOUT a leading slash, e.g. "v1/models".
services:
  openai:
    base_url: https://api.openai.com
    auth:
      header: Authorization
      format: "Bearer {secret}"   # {secret} is replaced with the OPENAI_API_KEY value
      secret: OPENAI_API_KEY      # name resolved from Docker secrets / env (never a file in the repo)
    rate_limit_per_minute: 20
    forward_headers: [content-type, accept]
    routes:
      - methods: [GET]
        path: "^v1/models$"
      - methods: [POST]
        path: "^v1/chat/completions$"
      - methods: [POST]
        path: "^v1/embeddings$"

  github:
    base_url: https://api.github.com
    auth:
      header: Authorization
      format: "Bearer {secret}"
      secret: GITHUB_TOKEN
    rate_limit_per_minute: 30
    forward_headers: [content-type, accept]
    routes:
      - methods: [GET]
        path: "^repos/[^/]+/[^/]+/issues$"
      - methods: [GET]
        path: "^repos/[^/]+/[^/]+/pulls$"
