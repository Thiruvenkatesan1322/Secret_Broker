# Example tasks. Only these named tasks can run, each with a fixed argv template (NO shell)
# and typed, validated args. Placeholders like {target} must be declared under `args`.
# `cwd` is resolved relative to BROKER_WORKSPACE and may not escape it.
tasks:
  fetch_report:
    command: ["python", "-c", "import pathlib;print(pathlib.Path('reports/daily.txt').read_text())"]
    cwd: "."
    timeout: 15
    auto_approve: true        # read-only -> runs immediately
    args: {}

  run_tests:
    command: ["python", "-m", "pytest", "-q"]
    cwd: "."
    timeout: 600
    auto_approve: true
    args: {}

  echo_note:
    command: ["python", "-c", "import sys;print('NOTE:', sys.argv[1])", "{message}"]
    cwd: "."
    timeout: 10
    auto_approve: false       # requires human approval
    args:
      message:
        type: string
        regex: "^[A-Za-z0-9 _.,:-]{1,200}$"

  deploy_staging:
    command: ["python", "-c", "import sys;print('would deploy to', sys.argv[1])", "{target}"]
    cwd: "."
    timeout: 300
    auto_approve: false
    args:
      target:
        type: enum
        choices: [staging, preview]
