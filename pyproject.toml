[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-broker"
version = "0.1.0"
description = "Local secrets proxy + approval-gated task runner for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
broker = "broker.__main__:main"
broker-approve = "broker.cli.approve:main"

[tool.setuptools]
packages = ["broker", "broker.cli"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
